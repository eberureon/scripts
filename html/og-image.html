<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leon Ebel - Software Developer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2C3E50 0%, #34495e 100%);
            width: 1200px;
            height: 630px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1100px;
            padding: 0 50px;
            box-sizing: border-box;
        }

        .content {
            flex: 1;
            color: white;
        }

        .name {
            font-size: 72px;
            font-weight: 700;
            margin: 0;
            line-height: 1;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .title {
            font-size: 36px;
            font-weight: 400;
            margin: 15px 0;
            color: #FF6B35;
            line-height: 1.2;
        }

        .location {
            font-size: 24px;
            font-weight: 300;
            margin: 10px 0;
            color: #BDC3C7;
            display: flex;
            align-items: center;
        }

        .location::before {
            content: "📍";
            margin-right: 8px;
        }

        .tech-stack {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .tech-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 8px 16px;
            font-size: 16px;
            color: white;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .accent-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 107, 53, 0.2) 0%, rgba(255, 107, 53, 0.05) 70%, transparent 100%);
            top: -150px;
            right: -150px;
        }

        .accent-circle-2 {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 107, 53, 0.15) 0%, rgba(255, 107, 53, 0.03) 70%, transparent 100%);
            bottom: -100px;
            left: -100px;
        }

        .code-pattern {
            position: absolute;
            top: 20px;
            right: 50px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.1);
            line-height: 1.4;
            transform: rotate(15deg);
        }

        .profile-section {
            flex: 0 0 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 50px;
        }

        .profile-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            object-fit: cover;
            object-position: center;
        }

        .geometric-accent {
            position: absolute;
            bottom: 50px;
            right: 50px;
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, transparent 40%, #FF6B35 40%, #FF6B35 60%, transparent 60%);
            opacity: 0.3;
            transform: rotate(45deg);
        }
    </style>
</head>
<body>
    <div class="accent-circle"></div>
    <div class="accent-circle-2"></div>
    
    <div class="code-pattern">
        const developer = {<br>
        &nbsp;&nbsp;name: "Leon",<br>
        &nbsp;&nbsp;skills: ["React", "TS"],<br>
        &nbsp;&nbsp;location: "München"<br>
        };
    </div>
    
    <div class="container">
        <div class="content">
            <h1 class="name">Leon Ebel</h1>
            <div class="title">Software Developer</div>
            <div class="location">München</div>
            
            <div class="tech-stack">
                <div class="tech-item">React</div>
                <div class="tech-item">TypeScript</div>
                <div class="tech-item">Node.js</div>
                <div class="tech-item">JavaScript</div>
            </div>
        </div>
        
        <div class="profile-section">
            <img src="profile.jpg" alt="Leon Ebel" class="profile-image">
        </div>
    </div>
    
    <div class="geometric-accent"></div>
</body>
</html>
